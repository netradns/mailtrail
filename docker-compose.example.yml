# ============================================================
#  MailTrail -- Docker Compose (Production Deploy)
#
#  Getting started:
#    1. Copy this file: cp docker-compose.example.yml docker-compose.yml
#    2. Edit volume paths and environment variables below
#    3. docker compose up -d
# ============================================================

services:
  mailtrail:
    image: ghcr.io/netradns/mailtrail:latest
    container_name: mailtrail
    restart: unless-stopped
    ports:
      - "8080:3000"

    volumes:
      # Postfix log files -- point to wherever your Postfix writes logs.
      # MailTrail needs read access (ingestion) and write access (log cleanup).
      - /docker/postfix/logs:/logs:z

      # Persistent data -- SQLite database, settings, auth, cursor.
      # Survives container rebuilds.
      - /docker/mailtrail/data:/data

    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=changeme
      - VIEWER_USER=viewer
      - VIEWER_PASS=viewer
      - LOG_DIR=/logs
      - DATA_DIR=/data
      - MAX_LOG_SIZE_GB=20
      - RETENTION_DAYS=90
      - INGEST_INTERVAL_MS=3000
      - SMTP_HOST=postfix
      - SMTP_PORT=25
      - TZ=UTC

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
